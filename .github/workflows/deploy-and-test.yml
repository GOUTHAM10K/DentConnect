name: Complete CI/CD Deployment & Live Selenium E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy-and-test:
    name: Build, Deploy & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation
      - name: Stage 2 - Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dent_web/package-lock.json

      - name: Install Google Chrome & Headless Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3 chromium-browser
          echo "Installed Chrome Version:"
          google-chrome --version || chromium-browser --version

      - name: Install Node Dependencies
        working-directory: dent_web
        run: npm ci

      # Stage 3: Build Application
      - name: Stage 3 - Build Application
        working-directory: dent_web
        run: npm run build

      # Stage 4: Static Analysis
      - name: Stage 4 - Static Analysis & Linting
        working-directory: dent_web
        run: npm run lint

      # Stage 5: Deploy to GitHub Pages (Branch + Native GitHub Actions API)
      - name: Stage 5 - Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dent_web/dist

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dent_web/dist'
        continue-on-error: true

      - name: Deploy to GitHub Pages API
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Stage 6: Wait for Live Deployment Availability
      - name: Stage 6 - Wait for Live Deployment
        run: |
          DEPLOY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Configured Live BASE_URL: $DEPLOY_URL"
          echo "BASE_URL=$DEPLOY_URL" >> $GITHUB_ENV
          
          echo "Waiting for live site $DEPLOY_URL to respond with HTTP 200..."
          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$DEPLOY_URL" || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Deployment is LIVE and responding!"
              SUCCESS=1
              break
            fi
            sleep 5
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "WARNING: Live deployment URL check did not return HTTP 200 within wait window."
          fi

      # Stage 7: Deployment Verification
      - name: Stage 7 - Deployment Verification
        run: |
          DEPLOY_URL="${{ env.BASE_URL }}"
          echo "Verifying Live Deployment at: $DEPLOY_URL"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$DEPLOY_URL" || true)
          echo "Live Deployment HTTP Status: $HTTP_STATUS"
          echo "Deployment Verification Completed."

      # Stage 8: Run Selenium E2E Tests against Live URL
      - name: Stage 8 - Execute Live Selenium E2E Tests (400+ Test Cases)
        working-directory: dent_web
        env:
          BASE_URL: ${{ env.BASE_URL }}
          SELENIUM_HEADLESS: "true"
        run: |
          echo "Executing Selenium E2E Test Suite against LIVE URL: $BASE_URL"
          npm run test:e2e:live

      # Stage 11: Upload Complete Test Artifacts
      - name: Stage 11 - Upload Complete Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-test-results
          path: |
            dent_web/Test Results/Excel/*.xlsx
            dent_web/Test Results/HTML/*.html
            dent_web/Test Results/JSON/*.json
            dent_web/Test Results/Screenshots/*.png
            dent_web/Test Results/Logs/*.log
            dent_web/Test Results/Summary/*.md
          retention-days: 30

      # Stage 12: Publish GitHub Action Summary
      - name: Stage 12 - Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f "dent_web/Test Results/Summary/summary.md" ]; then
            cat "dent_web/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Live GitHub Pages E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
            echo "Deployment URL: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
            echo "Execution completed." >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 13: Store Historical Results
      - name: Stage 13 - Store Historical Results
        if: always()
        run: |
          mkdir -p history
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          if [ -f "dent_web/Test Results/JSON/execution-results.json" ]; then
            cp "dent_web/Test Results/JSON/execution-results.json" "history/execution-results-$TIMESTAMP.json"
            echo "Historical test results stored as history/execution-results-$TIMESTAMP.json"
          fi
