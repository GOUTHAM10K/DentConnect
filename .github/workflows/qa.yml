name: QA Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dent_web/package-lock.json

      - name: Install frontend dependencies
        working-directory: dent_web
        run: npm ci

      - name: Run unit tests
        working-directory: dent_web
        run: npm run test:unit

      - name: Run security audit
        working-directory: dent_web
        run: npm run test:security

      - name: Install browser dependencies for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-driver

      - name: Run E2E Selenium tests
        working-directory: dent_web
        run: npm run test:e2e

      - name: Generate Excel QA report
        working-directory: dent_web
        run: npm run test:report

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            dent_web/test-reports/
            dent_web/test-results/
